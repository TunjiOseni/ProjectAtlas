services:
  grafana:
    image: grafana/grafana:latest
    container_name: projectatlas-grafana

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana-data:/var/lib/grafana

    restart: unless-stopped

volumes:
  grafana-data:
